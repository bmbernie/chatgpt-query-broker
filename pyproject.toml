[project]
name = "chatgpt-query-broker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3",
    "uvicorn[standard]>=0.53,<0.54",
]

[project.scripts]
chatgpt-query-broker = "chatgpt_query_broker.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
